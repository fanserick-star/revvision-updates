name: Verificar y activar actualización Rev Visión
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta a activar (ejemplo v0.4.2)
        required: true
permissions:
  contents: write
concurrency:
  group: revvision-update-channel
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verificar firma Ed25519, versión y SHA-256 de todos los componentes
        run: python3 .github/scripts/verify_release.py
      - name: Activar únicamente el paquete firmado y validado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Activar actualización Rev Visión verificada'
            git push origin HEAD:main
          fi
